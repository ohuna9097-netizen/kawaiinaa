<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신비로운 사주 & 운세</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header>
            <h1>신비한 사주 풀이</h1>
            <p>당신의 태어난 시간과 날짜에 새겨진 우주의 흐름을 읽어보세요.</p>
        </header>

        <section id="input-section" class="glass-card active">
            <form id="saju-form">
                <div class="input-group">
                    <label for="name">이름 (선택)</label>
                    <input type="text" id="name" placeholder="홍길동" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="birth-date">생년월일 (필수)</label>
                    <input type="date" id="birth-date" required>
                </div>

                <div class="input-group">
                    <label for="birth-time">태어난 시간 (선택)</label>
                    <select id="birth-time">
                        <option value="">모름 / 선택안함</option>
                        <option value="자">자시 (23:30 ~ 01:29)</option>
                        <option value="축">축시 (01:30 ~ 03:29)</option>
                        <option value="인">인시 (03:30 ~ 05:29)</option>
                        <option value="묘">묘시 (05:30 ~ 07:29)</option>
                        <option value="진">진시 (07:30 ~ 09:29)</option>
                        <option value="사">사시 (09:30 ~ 11:29)</option>
                        <option value="오">오시 (11:30 ~ 13:29)</option>
                        <option value="미">미시 (13:30 ~ 15:29)</option>
                        <option value="신">신시 (15:30 ~ 17:29)</option>
                        <option value="유">유시 (17:30 ~ 19:29)</option>
                        <option value="술">술시 (19:30 ~ 21:29)</option>
                        <option value="해">해시 (21:30 ~ 23:29)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">나의 운명 확인하기</button>
            </form>
        </section>

        <section id="loading-section" class="glass-card hidden">
            <div class="loader">
                <div class="spinner"></div>
                <p>우주의 기운을 분석하는 중...</p>
            </div>
        </section>

        <section id="result-section" class="glass-card hidden">
            <h2 id="result-title">당신의 사주 결과</h2>
            
            <div class="result-box">
                <h3>📜 기본 성향</h3>
                <p id="saju-nature"></p>
            </div>

            <div class="result-box">
                <h3>✨ 오늘의 운세</h3>
                <p id="today-fortune"></p>
            </div>

            <div class="luck-grid">
                <div class="luck-item">
                    <h3>🎨 행운의 컬러</h3>
                    <div class="color-display">
                        <div id="color-circle" class="color-circle"></div>
                        <span id="lucky-color-name"></span>
                    </div>
                </div>
                <div class="luck-item">
                    <h3>🎁 행운의 아이템</h3>
                    <div class="item-display">
                        <span id="lucky-item"></span>
                    </div>
                </div>
            </div>

            <button type="button" id="btn-reset" class="btn-outline">다시 보기</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
